version: '3.8'

services:
  legal-audit:
    build: .
    container_name: legal-audit
    restart: always
    ports:
      - "3000:3000"
    environment:
      # 必要环境变量
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/app/data/legal-library.db
      
      # AI配置（从环境文件读取或在此设置）
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-https://api.deepseek.com/v1}
      
      # 应用配置
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-AI合约风险审计系统}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-0.1.0}
      
      # 性能配置
      - NEXT_TELEMETRY_DISABLED=1
      - ENABLE_PERFORMANCE_MONITOR=${ENABLE_PERFORMANCE_MONITOR:-true}
      
      # 文件上传配置
      - NEXT_PUBLIC_MAX_FILE_SIZE=${NEXT_PUBLIC_MAX_FILE_SIZE:-10485760}  # 10MB
      - UPLOAD_DIR=/app/uploads
      
      # 法律文库配置
      - LEGAL_LIBRARY_ENABLED=${LEGAL_LIBRARY_ENABLED:-true}
      - LEGAL_LIBRARY_DATA_PATH=/app/data/legal-library.db
    volumes:
      # 数据库文件持久化
      - ./data:/app/data
      
      # 上传文件持久化
      - ./uploads:/app/uploads
      
      # 日志目录
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/performance?action=healthCheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - legal-audit-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：Nginx反向代理（如果需要）
  nginx:
    image: nginx:alpine
    container_name: legal-audit-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - legal-audit
    networks:
      - legal-audit-network

networks:
  legal-audit-network:
    driver: bridge